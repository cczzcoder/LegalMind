name: CI

# 门禁与本地一致：后端 ruff check / ruff format --check / alembic check / pytest，
# 前端 npm run lint / format:check / build（见 CODE_REVIEW.md 第 4 节）。
#
# 假设（按需调整）：
# - 使用 GitHub 托管的 ubuntu-latest；依赖走默认 PyPI 与 npm 官方源。
#   若改用国内自建 runner，可在对应步骤加镜像：
#     pip:  pip config set global.index-url https://pypi.tuna.tsinghua.edu.cn/simple
#     npm:  npm config set registry https://registry.npmmirror.com
# - 集成测试需要 PostgreSQL，用 service 容器提供，库名 legalmind_test。

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + migrations + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: legalmind
          POSTGRES_PASSWORD: legalmind
          POSTGRES_DB: legalmind_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U legalmind"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://legalmind:legalmind@127.0.0.1:5432/legalmind_test
      TEST_DATABASE_URL: postgresql+asyncpg://legalmind:legalmind@127.0.0.1:5432/legalmind_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: legalmind/backend/pyproject.toml

      - name: Install dependencies
        working-directory: legalmind/backend
        # 依赖走**锁文件**：`pyproject.toml` 里是范围约束，同一个提交在不同日子装出来
        # 可能不是同一套。锁文件由 `pip-compile` 生成（改依赖后要重新跑，见 CONTRIBUTING）。
        # 项目本体用 `--no-deps` 装，免得它再把范围约束解析一遍。
        run: |
          pip install -r requirements.lock
          pip install --no-deps -e .

      - name: Lint and format
        working-directory: legalmind/backend
        run: |
          ruff check .
          ruff format --check .

      - name: Migration drift check
        working-directory: legalmind/backend
        run: |
          alembic upgrade head
          alembic check

      - name: Tests
        working-directory: legalmind/backend
        run: pytest -q

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: legalmind/frontend/package-lock.json

      - name: Install dependencies
        working-directory: legalmind/frontend
        run: npm ci

      - name: Lint and format
        working-directory: legalmind/frontend
        run: |
          npm run lint
          npm run format:check

      - name: Build
        working-directory: legalmind/frontend
        run: npm run build
