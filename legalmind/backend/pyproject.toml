[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "legalmind"
version = "0.1.0"
description = "Evidence-first legal knowledge and research system"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "asyncpg>=0.29,<1",
    "alembic>=1.13,<2",
    "argon2-cffi==25.1.0",
    "pyotp==2.10.0",
    "cryptography==50.0.2",
    # 第 1 层原生解析（设计 §2）：纯 CPU、零外发、许可宽松（MIT / Apache-2.0 / BSD-3-Clause）
    "pdfplumber>=0.11,<0.12",
    "pypdfium2>=4.30,<5",
    "python-docx>=1.1,<2",
    "lxml>=5,<7",
    # 向量通路（设计 8.2、8.3）：pgvector 的 SQLAlchemy 类型绑定，纯 Python、很小
    "pgvector>=0.3,<1",
    # 短期内容缓存（设计 §9.3 第三层、§14.1）：**只作 TTL 键值存储，不作队列**——
    # 队列用自研 worker（原子领取 + 租约），不引入 Celery。留空 CACHE_URL 即禁用。
    "redis>=5,<6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "httpx>=0.27,<1",
    "ruff>=0.9,<1",
    # 提交前门禁（见仓库根的 .pre-commit-config.yaml）。它**不参与 CI 的测试步骤**，
    # 只是让本地在提交前跑一遍和 CI 一样的命令。
    "pre-commit>=4,<5",
    # 生成 `requirements.lock` 用（CI 与本地都从锁文件装依赖）。改动依赖后要重新跑一次，
    # 命令见 CONTRIBUTING「依赖锁定」。
    "pip-tools>=7,<8",
]
# 本地嵌入模型（设计 9.5：敏感资料不默认外发）。**故意不放进默认依赖**：torch 体积以 GB 计，
# 只在要跑向量通路时才装。模型权重走 `HF_ENDPOINT=https://hf-mirror.com`——本机 HuggingFace
# 直连不通、只有镜像的下载端点可用（元数据 API 返回 403，不影响下载）。
embeddings = [
    "torch>=2.2,<3",
    "sentence-transformers>=3,<6",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
