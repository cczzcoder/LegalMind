[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "legalmind"
version = "0.1.0"
description = "Evidence-first legal knowledge and research system"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "asyncpg>=0.29,<1",
    "alembic>=1.13,<2",
    "argon2-cffi==25.1.0",
    "pyotp==2.10.0",
    "cryptography==50.0.2",
    # 第 1 层原生解析（设计 §2）：纯 CPU、零外发、许可宽松（MIT / Apache-2.0 / BSD-3-Clause）
    "pdfplumber>=0.11,<0.12",
    "pypdfium2>=4.30,<5",
    "python-docx>=1.1,<2",
    "lxml>=5,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "httpx>=0.27,<1",
    "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
