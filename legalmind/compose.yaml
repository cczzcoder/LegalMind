name: legalmind

x-backend-environment: &backend-environment
  APP_ENV: ${APP_ENV:-development}
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
  MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:-}
  TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
  STORAGE_ROOT: /data/artifacts
  MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-52428800}
  # 容器内走服务名；宿主机跑 worker/CLI 时用 .env 里的 127.0.0.1
  CACHE_URL: redis://redis:6379/0
  ANSWER_CACHE_TTL_SECONDS: ${ANSWER_CACHE_TTL_SECONDS:-86400}

services:
  postgres:
    # 带 pgvector 的官方镜像：原生 postgres:17 不带 vector 扩展，而设计 §14.1 的常驻服务清单
    # 写的就是「PostgreSQL（含后续 pgvector）」，所以换镜像属于既定基线，不是新增组件。
    # ⚠️ **摘要（digest）固定住**：`pg17` 这类 tag 是可变的，上游一重建镜像，本地与 CI 就跑在
    # 不同的字节上了。升级时在本机 pull 后取新摘要替换即可：
    #   docker image inspect <image> --format '{{index .RepoDigests 0}}'
    # ⚠️ 摘要取自 **linux/amd64**（第一阶段开发基线，见设计 §14）；换 arm64 机器要重新取。
    image: pgvector/pgvector:pg17@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_DB: ${POSTGRES_DB:?required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    # 短期内容缓存（设计 §9.3 第三层、§14.1）。**只作 TTL 键值存储，不作队列**——
    # 队列用自研 worker（FOR UPDATE SKIP LOCKED 原子领取 + 租约），**Celery 仍不引入**。
    # 摘要固定，理由与取法同 postgres
    image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    # ⚠️ **关掉全部持久化**：缓存里是「跑过脱敏的回答」，要求「过期即焚」。
    # 开了 RDB/AOF 就会落盘、进而进备份，那就等于变相落库了。
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 64mb
      - --maxmemory-policy
      - allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    build:
      context: ./backend
    environment: *backend-environment
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ./backend
    environment: *backend-environment
    # 原始文件与数据库一样需要持久化和备份；不挂到任何静态目录
    volumes:
      - artifacts_data:/data/artifacts
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  artifacts_data:
